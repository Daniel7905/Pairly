<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Pairly</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1><a href="index.html">Pairly</a></h1>
    <nav>
      <a href="index.html#products">Products</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a class="cart-link" href="cart.html" aria-label="Cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
      Cart <span class="cart-count" id="cartCount">0</span>
    </a>
  </header>

  <main class="auth-wrap">

    <div class="auth-art">
      <h2>Welcome back.</h2>
      <p>Log in to see your orders and check out faster.</p>
    </div>

    <div class="auth-panel">
      <div class="auth-card">
        <h2>Log in</h2>
        <p class="sub">Enter your details to continue.</p>

        <div class="alert" id="alert" role="alert" hidden></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" type="password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" aria-label="Show password">Show</button>
            </div>
          </div>

          <label class="check">
            <input type="checkbox" id="remember" checked>
            <span>Keep me logged in on this device</span>
          </label>

          <button class="button submit" id="submitBtn" type="submit">Log in</button>
        </form>

        <p class="switch">New to Pairly? <a href="register.html" id="toRegister">Create an account</a></p>
      </div>
    </div>

  </main>

  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script>
    const next = Auth.safeNext();
    document.getElementById("toRegister").href = "register.html?next=" + encodeURIComponent(next);

    // Already logged in? Go straight on.
    if (Auth.currentUser()) window.location.replace(next);

    Auth.wirePasswordToggles();

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alert");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      alertBox.hidden = true;
      btn.disabled = true;
      btn.textContent = "Logging in…";

      const result = await Auth.login(
        document.getElementById("email").value,
        document.getElementById("password").value,
        document.getElementById("remember").checked
      );

      if (result.ok) {
        window.location.href = next;
      } else {
        alertBox.textContent = result.error;
        alertBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
