<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account – Pairly</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1><a href="index.html">Pairly</a></h1>
    <nav>
      <a href="index.html#products">Products</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a class="cart-link" href="cart.html" aria-label="Cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
      Cart <span class="cart-count" id="cartCount">0</span>
    </a>
  </header>

  <main class="auth-wrap">

    <div class="auth-art">
      <h2>Join Pairly.</h2>
      <p>Create an account to track orders and fill in your details automatically at checkout.</p>
    </div>

    <div class="auth-panel">
      <div class="auth-card">
        <h2>Create account</h2>
        <p class="sub">It only takes a minute.</p>

        <div class="alert" id="alert" role="alert" hidden></div>

        <form id="registerForm">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" type="text" autocomplete="name" minlength="2" required>
          </div>

          <div class="row2">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
              <label for="phone">Mobile <span class="opt">(optional)</span></label>
              <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10"
                     pattern="[6-9][0-9]{9}" title="Enter a 10-digit mobile number">
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" type="password" autocomplete="new-password"
                     pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                     title="At least 8 characters, with a letter and a number" required>
              <button type="button" class="pw-toggle" aria-label="Show password">Show</button>
            </div>
            <div class="meter" aria-hidden="true"><span id="meterBar"></span></div>
            <p class="meter-text" id="meterText">Use 8+ characters with a letter and a number.</p>
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <div class="pw">
              <input id="confirm" type="password" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" aria-label="Show password">Show</button>
            </div>
          </div>

          <label class="check">
            <input type="checkbox" id="terms" required>
            <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
          </label>

          <button class="button submit" id="submitBtn" type="submit">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="login.html" id="toLogin">Log in</a></p>
      </div>
    </div>

  </main>

  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script>
    const next = Auth.safeNext();
    document.getElementById("toLogin").href = "login.html?next=" + encodeURIComponent(next);

    if (Auth.currentUser()) window.location.replace(next);

    Auth.wirePasswordToggles();

    const $ = id => document.getElementById(id);
    const pw = $("password"), confirmBox = $("confirm");

    // ----- phone: digits only -----
    $("phone").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); });

    // ----- password strength meter -----
    const levels = [
      { text: "Too weak",    color: "#e5484d", width: "15%" },
      { text: "Weak",        color: "#e5484d", width: "30%" },
      { text: "Okay",        color: "#f5a524", width: "55%" },
      { text: "Strong",      color: "#1f9d55", width: "80%" },
      { text: "Very strong", color: "#1f9d55", width: "100%" }
    ];

    function score(p) {
      let s = 0;
      if (p.length >= 8) s++;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
      if (/\d/.test(p)) s++;
      if (/[^A-Za-z0-9]/.test(p)) s++;
      return s;
    }

    function checkMatch() {
      confirmBox.setCustomValidity(confirmBox.value && confirmBox.value !== pw.value ? "Passwords do not match" : "");
    }

    pw.addEventListener("input", function () {
      if (!pw.value) {
        $("meterBar").style.width = "0";
        $("meterText").textContent = "Use 8+ characters with a letter and a number.";
      } else {
        const l = levels[score(pw.value)];
        $("meterBar").style.width = l.width;
        $("meterBar").style.background = l.color;
        $("meterText").textContent = l.text;
      }
      checkMatch();
    });
    confirmBox.addEventListener("input", checkMatch);

    // ----- submit -----
    const alertBox = $("alert"), btn = $("submitBtn");

    $("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();                      // runs only when all fields are valid
      alertBox.hidden = true;
      btn.disabled = true;
      btn.textContent = "Creating account…";

      const result = await Auth.register({
        name: $("name").value, email: $("email").value,
        phone: $("phone").value, password: pw.value
      });

      if (result.ok) {
        window.location.href = next;
      } else {
        alertBox.textContent = result.error;
        alertBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "Create account";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  </script>
</body>
</html>
