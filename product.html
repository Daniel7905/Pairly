<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product – Pairly</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product.css">
  <link rel="stylesheet" href="cart.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1><a href="index.html">Pairly</a></h1>
    <nav>
      <a href="index.html#products">Products</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a class="cart-link" href="cart.html" aria-label="Cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
      Cart <span class="cart-count" id="cartCount">0</span>
    </a>
  </header>

  <!-- The product is filled in by the script below, based on ?id= in the address -->
  <main class="detail" id="detail"></main>

  <section class="products" id="related">
    <h2>You may also like</h2>
    <div class="grid" id="relatedGrid"></div>
  </section>

  <footer>
    <p>&copy; 2026 Pairly. All rights reserved.</p>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const p = PRODUCTS[id];
    const box = document.getElementById("detail");
    const related = document.getElementById("related");

    function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function showToast(message) {
      const t = document.getElementById("toast");
      t.textContent = message;
      t.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { t.classList.remove("show"); }, 2200);
    }

    if (!p) {
      // Unknown or missing id
      related.hidden = true;
      box.innerHTML =
        '<div class="notfound"><h2>Product not found</h2>' +
        '<p>Sorry, we couldn\'t find that product.</p>' +
        '<a class="button" href="index.html#products">Back to shop</a></div>';
    } else {
      document.title = p.name + " – Pairly";

      const badge = p.badge
        ? '<span class="badge' + (p.sale ? " sale" : "") + '">' + p.badge + "</span>" : "";
      const oldPrice = p.old ? " <del>₹" + p.old + "</del>" : "";
      const sizes = p.sizes.length
        ? '<p class="label">Size</p><div class="sizes" id="sizes">' +
          p.sizes.map(function (s) { return '<button type="button" data-size="' + s + '">' + s + "</button>"; }).join("") +
          "</div>"
        : "";

      box.innerHTML =
        '<p class="crumbs"><a href="index.html">Home</a> / <a href="index.html#products">Products</a> / ' + p.name + "</p>" +
        '<div class="detail-grid">' +
          '<div class="gallery">' + badge + '<img src="' + p.image + '" alt="' + p.name + '"></div>' +
          '<div class="info">' +
            '<p class="eyebrow">' + p.category + "</p>" +
            "<h2>" + p.name + "</h2>" +
            '<p class="rating">' + stars(p.rating) + " <span>(" + p.reviews + " reviews)</span></p>" +
            '<p class="price">₹' + p.price + oldPrice + "</p>" +
            '<p class="desc">' + p.desc + "</p>" +
            sizes +
            '<p class="label">Quantity</p>' +
            '<div class="buy-row">' +
              '<div class="qty"><button type="button" id="minus" aria-label="Decrease">−</button>' +
              '<span id="qty">1</span><button type="button" id="plus" aria-label="Increase">+</button></div>' +
            "</div>" +
            '<div class="actions">' +
              '<button type="button" class="button add outline" id="addBtn">Add to cart</button>' +
              '<button type="button" class="button add" id="buyBtn">Buy now</button>' +
            "</div>" +
            '<p class="msg" id="msg"></p>' +
            '<ul class="perks"><li>🚚 Free shipping over ₹999</li><li>↩️ 30-day returns</li><li>🔒 Secure checkout</li></ul>' +
            "<details open><summary>Product details</summary><ul>" +
              p.details.map(function (d) { return "<li>" + d + "</li>"; }).join("") + "</ul></details>" +
            "<details><summary>Shipping &amp; returns</summary>" +
              "<p>Orders ship within 2 business days. Free standard shipping on orders over ₹999. Return unworn items within 30 days for a full refund.</p></details>" +
          "</div>" +
        "</div>";

      // ----- Size selection -----
      let size = "";
      const sizeBox = document.getElementById("sizes");
      if (sizeBox) {
        sizeBox.addEventListener("click", function (e) {
          if (!e.target.dataset.size) return;
          sizeBox.querySelectorAll("button").forEach(function (b) { b.classList.remove("active"); });
          e.target.classList.add("active");
          size = e.target.dataset.size;
          document.getElementById("msg").textContent = "";
        });
      }

      // ----- Quantity -----
      let qty = 1;
      const qtyEl = document.getElementById("qty");
      document.getElementById("minus").onclick = function () { if (qty > 1) qtyEl.textContent = --qty; };
      document.getElementById("plus").onclick = function () { if (qty < 10) qtyEl.textContent = ++qty; };

      // ----- Add to cart / Buy now -----
      // Returns false (and shows a message) if a size is needed but not chosen
      function readyToAdd() {
        if (p.sizes.length && !size) {
          document.getElementById("msg").textContent = "Please choose a size first.";
          return false;
        }
        return true;
      }

      document.getElementById("addBtn").onclick = function () {
        if (!readyToAdd()) return;
        addToCart(id, size, qty);
        showToast("Added " + qty + " × " + p.name + (size ? " (size " + size + ")" : "") + " to cart");
      };

      // Buy now: go straight to checkout with just this item (the cart is not touched)
      document.getElementById("buyBtn").onclick = function () {
        if (!readyToAdd()) return;
        window.location.href = "checkout.html?buy=" + encodeURIComponent(id) +
          "&size=" + encodeURIComponent(size) + "&qty=" + qty;
      };

      // ----- Related products: same category first, then others -----
      const entries = Object.keys(PRODUCTS).filter(function (k) { return k !== id; });
      entries.sort(function (a, b) {
        return (PRODUCTS[b].category === p.category) - (PRODUCTS[a].category === p.category);
      });

      document.getElementById("relatedGrid").innerHTML = entries.slice(0, 3).map(function (k) {
        const r = PRODUCTS[k];
        const rb = r.badge ? '<span class="badge' + (r.sale ? " sale" : "") + '">' + r.badge + "</span>" : "";
        const ro = r.old ? " <del>₹" + r.old + "</del>" : "";
        const url = "product.html?id=" + k;
        return '<article class="product" data-url="' + url + '" style="cursor:pointer">' +
          '<div class="product-img">' + rb + '<img src="' + r.image + '" alt="' + r.name + '"></div>' +
          '<div class="product-body"><p class="category">' + r.category + "</p>" +
          '<h3><a href="' + url + '" style="color:inherit;text-decoration:none">' + r.name + "</a></h3>" +
          '<p class="rating">' + stars(r.rating) + " <span>(" + r.reviews + ")</span></p>" +
          '<div class="product-footer"><p class="price">₹' + r.price + ro + '</p>' +
          '<a class="button" href="' + url + '">View</a></div></div></article>';
      }).join("");

      document.querySelectorAll("#relatedGrid .product").forEach(function (card) {
        card.addEventListener("click", function () { window.location.href = card.dataset.url; });
      });
    }
  </script>
</body>
</html>
