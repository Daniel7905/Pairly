<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart – Pairly</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cart.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1><a href="index.html">Pairly</a></h1>
    <nav>
      <a href="index.html#products">Products</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a class="cart-link" href="cart.html" aria-label="Cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
      Cart <span class="cart-count" id="cartCount">0</span>
    </a>
  </header>

  <main class="cart-page">
    <h2>Your Cart</h2>
    <div id="cartContent"></div>
  </main>

  <footer>
    <p>&copy; 2026 Pairly. All rights reserved.</p>
  </footer>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script>
    const FREE_SHIPPING_FROM = 999;   // free shipping at or above this subtotal
    const SHIPPING_FEE = 99;          // otherwise this is charged
    const content = document.getElementById("cartContent");

    function money(n) { return "₹" + n.toLocaleString("en-IN"); }

    function render() {
      // ignore anything in the cart that is no longer in products.js
      const cart = getCart().filter(function (item) { return PRODUCTS[item.id]; });

      if (!cart.length) {
        content.innerHTML =
          '<div class="empty-cart"><div class="big">🛍️</div><h3>Your cart is empty</h3>' +
          '<p>Looks like you haven\'t added anything yet.</p>' +
          '<a class="button" href="index.html#products">Start shopping</a></div>';
        updateCartCount();
        return;
      }

      let subtotal = 0;
      const rows = cart.map(function (item, i) {
        const p = PRODUCTS[item.id];
        const line = p.price * item.qty;
        subtotal += line;
        return '<div class="cart-item">' +
          '<a href="product.html?id=' + item.id + '"><img src="' + p.image + '" alt="' + p.name + '"></a>' +
          '<div>' +
            '<a class="ci-name" href="product.html?id=' + item.id + '">' + p.name + '</a>' +
            '<p class="ci-meta">' + p.category + (item.size ? " · Size " + item.size : "") + '</p>' +
            '<p class="ci-price">' + money(p.price) + ' each</p>' +
            '<div class="cart-qty">' +
              '<button type="button" data-act="dec" data-i="' + i + '" aria-label="Decrease quantity">−</button>' +
              '<span>' + item.qty + '</span>' +
              '<button type="button" data-act="inc" data-i="' + i + '" aria-label="Increase quantity">+</button>' +
            '</div>' +
          '</div>' +
          '<div class="ci-right"><p class="ci-total">' + money(line) + '</p>' +
            '<button type="button" class="remove" data-act="remove" data-i="' + i + '">Remove</button></div>' +
        '</div>';
      }).join("");

      const shipping = subtotal >= FREE_SHIPPING_FROM ? 0 : SHIPPING_FEE;
      const note = shipping
        ? "Add " + money(FREE_SHIPPING_FROM - subtotal) + " more for free shipping."
        : "You've got free shipping!";

      content.innerHTML =
        '<div class="cart-layout">' +
          '<div class="cart-items">' + rows +
            '<button type="button" class="clear" data-act="clear">Clear cart</button></div>' +
          '<aside class="summary"><h3>Order summary</h3>' +
            '<div class="row"><span>Subtotal</span><span>' + money(subtotal) + '</span></div>' +
            '<div class="row"><span>Shipping</span><span class="' + (shipping ? "" : "free") + '">' +
              (shipping ? money(shipping) : "Free") + '</span></div>' +
            '<div class="row total"><span>Total</span><span>' + money(subtotal + shipping) + '</span></div>' +
            '<p class="note">' + note + '</p>' +
            '<button type="button" class="button checkout" data-act="checkout">Checkout</button>' +
            '<a class="continue" href="index.html#products">← Continue shopping</a>' +
          '</aside>' +
        '</div>';

      updateCartCount();
    }

    // One click handler for all buttons in the cart
    content.addEventListener("click", function (e) {
      const act = e.target.dataset.act;
      if (!act) return;
      const cart = getCart().filter(function (item) { return PRODUCTS[item.id]; });
      const i = Number(e.target.dataset.i);

      if (act === "inc" && cart[i].qty < 10) cart[i].qty++;
      if (act === "dec" && cart[i].qty > 1) cart[i].qty--;
      if (act === "remove") cart.splice(i, 1);
      if (act === "clear") cart.length = 0;

      if (act === "checkout") {
        window.location.href = "checkout.html";
        return;
      }

      saveCart(cart);
      render();
    });

    render();
  </script>
</body>
</html>
